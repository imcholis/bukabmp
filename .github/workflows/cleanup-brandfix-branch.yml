name: Cleanup temporary brandfix branch

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'imcholis/bukabmp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete temporary branch and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete brandfix-v1.0.2 || true
          git rm ".github/workflows/cleanup-brandfix-branch.yml"
          git commit -m "chore: complete temporary branch cleanup"
          git push origin HEAD:main
