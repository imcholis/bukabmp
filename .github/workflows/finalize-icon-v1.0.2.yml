name: Finalize icon repair v1.0.2

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'imcholis/bukabmp'
    runs-on: ubuntu-latest
    env:
      BMP_API_BASE_URL: https://community.bukabmp.workers.dev
      BMP_TELEGRAM_CHANNEL_URL: https://t.me/bukabmp
      BMP_TELEGRAM_GROUP_URL: https://t.me/+0pAg9ymEhWdkZmNl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate version and source
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/manifest.json').version")
          test "$VERSION" = "1.0.2"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test -z "$(git ls-remote --tags origin "refs/tags/v${VERSION}")"
          npm run validate

      - name: Build self-contained extension
        run: npm run build:release

      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/manifest.json').version")
          cd dist
          zip -qr "BMP-Terbuka-v${VERSION}.zip" "BMP-Terbuka-v${VERSION}"
          sha256sum "BMP-Terbuka-v${VERSION}.zip" > "BMP-Terbuka-v${VERSION}.zip.sha256"
          unzip -t "BMP-Terbuka-v${VERSION}.zip"

      - name: Remove one-shot finalizer and tag clean commit
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/manifest.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/finalize-icon-v1.0.2.yml"
          git commit -m "chore: remove one-shot v${VERSION} finalizer"
          git push origin HEAD:main
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/manifest.json').version")
          gh release create "v${VERSION}" \
            "dist/BMP-Terbuka-v${VERSION}.zip" \
            "dist/BMP-Terbuka-v${VERSION}.zip.sha256" \
            --verify-tag \
            --title "BMP Terbuka v${VERSION}" \
            --notes "Icon repair: seluruh icon extension diregenerasi dari master logo final untuk memperbaiki icon128.png yang tampil rusak di GitHub. Tidak ada perubahan pada alur akses, OCR, PDF, atau community activation."
